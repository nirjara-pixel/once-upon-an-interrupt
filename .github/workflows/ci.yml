name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest app/tests -q

  api-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      HF_MODEL: ${{ vars.HF_MODEL || 'meta-llama/Llama-3.1-8B-Instruct' }}
      FISH_TTS_MODEL: ${{ vars.FISH_TTS_MODEL || 's1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Hugging Face smoke test
        run: python scripts/smoke_test_hf.py
      - name: Fish.audio smoke test
        run: python scripts/smoke_test_fish.py
